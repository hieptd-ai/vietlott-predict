name: Sync data from upstream

# Vietlott blocks non-Vietnam IPs, so GitHub runners cannot crawl vietlott.vn themselves.
# Instead this pulls the daily-updated NDJSON files from the upstream project
# (vietvudanh/vietlott-data, crawled from Vietnam), re-renders README/docs, commits the
# result to main and triggers a Pages deploy.
on:
  schedule:
    # upstream commits at ~00:01 and ~12:01 UTC
    - cron: "41 0 * * *"
    - cron: "41 12 * * *"
  workflow_dispatch:
    inputs:
      upstream:
        description: "Upstream repository (owner/name) to copy data/ from"
        default: "vietvudanh/vietlott-data"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-data
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ${{ inputs.upstream || vars.UPSTREAM_REPO || 'vietvudanh/vietlott-data' }}
  VIETLOTT_REPO: ${{ github.repository }}
  VIETLOTT_SITE_URL: ${{ vars.VIETLOTT_SITE_URL }}
  VIETLOTT_GA_ID: ${{ vars.VIETLOTT_GA_ID }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch upstream data
        run: |
          git clone --depth 1 --filter=blob:none --sparse "https://github.com/${UPSTREAM_REPO}.git" "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" sparse-checkout set data
          ls -la "$RUNNER_TEMP/upstream/data"

      - name: Merge upstream draws into data/
        id: merge
        run: |
          set -euo pipefail
          for src in "$RUNNER_TEMP"/upstream/data/*.jsonl; do
            name=$(basename "$src")
            dst="data/$name"
            # never shrink a dataset: only accept upstream files that hold at least as many draws
            if [ ! -f "$dst" ] || [ "$(wc -l < "$src")" -ge "$(wc -l < "$dst")" ]; then
              cp "$src" "$dst"
            else
              echo "::warning::skip $name: upstream has fewer rows ($(wc -l < "$src")) than local ($(wc -l < "$dst"))"
            fi
          done
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new draws."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data
          fi

      - name: Setup Go
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: "crawler/go.mod"
          cache-dependency-path: crawler/go.sum

      - name: Render README & docs
        if: steps.merge.outputs.changed == 'true'
        run: |
          cd crawler
          go run ./cmd/vietlott render-readme
          go run ./cmd/vietlott render-docs

      - name: Commit & push
        if: steps.merge.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data readme.md docs index.html
          git commit -m "sync data from ${UPSTREAM_REPO} @ $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push origin HEAD:main

      # pushes made with GITHUB_TOKEN do not start other workflows, so dispatch the deploy explicitly
      - name: Trigger Pages deploy
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "${{ github.repository }}"
